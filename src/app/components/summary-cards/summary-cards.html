<!-- Tarjeta Billetera Digital Personal (Personal Wallet Hero) -->
<div class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 dark:from-slate-900 dark:via-slate-900 dark:to-slate-950 text-white p-4 sm:p-5 shadow-lg shadow-slate-900/10 border border-slate-700/60 dark:border-slate-800/80">
  
  <!-- Glow decorativos sutiles -->
  <div class="absolute -right-12 -top-12 w-48 h-48 bg-emerald-500/15 rounded-full blur-2xl pointer-events-none"></div>
  <div class="absolute -left-12 -bottom-12 w-48 h-48 bg-sky-500/10 rounded-full blur-2xl pointer-events-none"></div>

  <!-- Fila 1: Encabezado de la Tarjeta y Acceso a Mis Cuentas -->
  <div class="relative z-10 flex items-center justify-between gap-2">
    <div class="flex items-center gap-2">
      <span class="inline-flex items-center gap-1.5 text-[11px] font-bold uppercase tracking-wider text-emerald-400 bg-emerald-950/60 border border-emerald-800/60 px-2.5 py-0.5 rounded-full">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span>Dinero Total Disponible</span>
      </span>
    </div>

    <!-- Acceso rápido a Cuentas & Efectivo -->
    <button
      (click)="openAccountsModal()"
      type="button"
      class="text-[11px] font-semibold text-slate-300 hover:text-white bg-white/10 hover:bg-white/15 px-2.5 py-1 rounded-xl transition cursor-pointer flex items-center gap-1 shadow-2xs border border-white/5"
      title="Ver desglose detallado de efectivo y cuentas"
    >
      <span>💳 Mis Cuentas</span>
      <span class="text-xs">➔</span>
    </button>
  </div>

  <!-- Fila 2: Saldo Principal Gigante y Sub-Balances Personales -->
  <div class="relative z-10 mt-2 sm:mt-2.5 flex flex-col md:flex-row md:items-end justify-between gap-3">
    <div>
      <div class="text-2xl sm:text-3xl lg:text-4xl font-extrabold tracking-tight text-white flex items-baseline gap-2">
        <span>S/ {{ totalBalance | number:'1.2-2' }}</span>
      </div>
      <p class="text-[11px] text-slate-400 mt-0.5">Saldo neto consolidado de todas tus fuentes</p>
    </div>

    <!-- Píldoras de Micro-Balances (Efectivo / Bancos / Gasto de Hoy) -->
    <div class="flex items-center gap-1.5 sm:gap-2 flex-wrap">
      <!-- Efectivo -->
      <button
        (click)="openAccountsModal()"
        type="button"
        class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-xs transition cursor-pointer"
        title="Ver efectivo disponible"
      >
        <span class="text-xs">💵</span>
        <span class="text-slate-300 font-medium">Efectivo:</span>
        <span class="font-bold text-emerald-300">S/ {{ cashBalance | number:'1.2-2' }}</span>
      </button>

      <!-- Bancos -->
      <button
        (click)="openAccountsModal()"
        type="button"
        class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-xs transition cursor-pointer"
        title="Ver cuentas bancarias"
      >
        <span class="text-xs">🏦</span>
        <span class="text-slate-300 font-medium">Cuentas:</span>
        <span class="font-bold text-sky-300">S/ {{ bankBalance | number:'1.2-2' }}</span>
      </button>

      <!-- Gasto Hoy -->
      <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-xl bg-rose-950/40 border border-rose-800/40 text-xs">
        <span class="text-xs">🔥</span>
        <span class="text-rose-200/80 font-medium">Hoy:</span>
        <span class="font-bold text-rose-300">S/ {{ todayExpense | number:'1.2-2' }}</span>
      </div>
    </div>
  </div>

  <!-- Fila 3: Barra de Acciones Rápidas (Billetera Táctil) -->
  <div class="relative z-10 mt-3 sm:mt-3.5 pt-3 border-t border-white/10 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2">
    
    <!-- 1. Registrar Ingreso -->
    <button
      (click)="openIncomeModal()"
      type="button"
      class="px-3 py-1.5 rounded-xl bg-emerald-600/90 hover:bg-emerald-500 text-white text-xs font-bold transition shadow-xs flex items-center justify-center gap-1.5 cursor-pointer active:scale-95"
    >
      <span class="text-sm">＋</span>
      <span>Ingreso</span>
    </button>

    <!-- 2. Registrar Gasto -->
    <button
      (click)="openExpenseModal()"
      type="button"
      class="px-3 py-1.5 rounded-xl bg-rose-600/90 hover:bg-rose-500 text-white text-xs font-bold transition shadow-xs flex items-center justify-center gap-1.5 cursor-pointer active:scale-95"
    >
      <span class="text-sm">－</span>
      <span>Gasto</span>
    </button>

    <!-- 3. Transferir / Tren -->
    <button
      (click)="openTransferModal()"
      type="button"
      class="px-3 py-1.5 rounded-xl bg-sky-600/90 hover:bg-sky-500 text-white text-xs font-bold transition shadow-xs flex items-center justify-center gap-1.5 cursor-pointer active:scale-95"
      title="Transferir entre cuentas o recargar tarjeta del tren"
    >
      <span class="text-xs">⇄</span>
      <span>Transferir</span>
    </button>

    <!-- 4. Mis Cuentas -->
    <button
      (click)="openAccountsModal()"
      type="button"
      class="px-3 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 border border-white/10 text-white text-xs font-semibold transition flex items-center justify-center gap-1.5 cursor-pointer active:scale-95"
      title="Ver desglose de cuentas y efectivo"
    >
      <span class="text-xs">💳</span>
      <span>Cuentas</span>
    </button>

    <!-- 5. Control de Deudas -->
    <button
      (click)="openDebtsModal()"
      type="button"
      class="px-3 py-1.5 rounded-xl bg-orange-600/90 hover:bg-orange-500 text-white text-xs font-bold transition shadow-xs flex items-center justify-center gap-1.5 cursor-pointer active:scale-95"
      title="Abrir ventana de control de deudas y compromisos"
    >
      <span class="text-xs">👥</span>
      <span>Deudas</span>
      @if (pendingDebtsCount > 0) {
        <span class="px-1.5 py-0.2 rounded-full text-[10px] font-extrabold bg-white text-orange-700">
          {{ pendingDebtsCount }}
        </span>
      }
    </button>

    <!-- 6. Análisis de Gastos -->
    <button
      (click)="openCategoryModal()"
      type="button"
      class="px-3 py-1.5 rounded-xl bg-purple-600/90 hover:bg-purple-500 text-white text-xs font-bold transition shadow-xs flex items-center justify-center gap-1.5 cursor-pointer active:scale-95"
      title="Abrir ventana de distribución de gastos por categoría"
    >
      <span class="text-xs">📊</span>
      <span>Gastos</span>
    </button>

  </div>

</div>
