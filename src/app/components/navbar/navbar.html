<header class="sticky top-0 z-30 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800 transition-colors shrink-0">
  <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-14">
      
      <!-- Logo & Brand Personal -->
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center text-white shadow-md shadow-emerald-500/20 shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="text-base sm:text-lg font-extrabold tracking-tight text-slate-900 dark:text-white">FinanZen</span>
            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 border border-emerald-200/60 dark:border-emerald-800/60">
              Personal
            </span>
          </div>
          <p class="text-[11px] text-slate-400 dark:text-slate-500 hidden sm:block">Mi Billetera & Finanzas Diarias</p>
        </div>
      </div>

      <!-- Controles de la Derecha: Indicador de Sincronización, Modo Oscuro y Perfil -->
      <div class="flex items-center gap-2 sm:gap-3">
        
        <!-- Indicador de Sincronización en la Nube -->
        <div class="hidden sm:flex items-center gap-1.5 px-2.5 py-1 rounded-xl bg-slate-100 dark:bg-slate-800/80 text-[11px] font-semibold text-slate-600 dark:text-slate-300 border border-slate-200/60 dark:border-slate-700">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
          <span>Firestore en vivo</span>
        </div>

        <!-- Modo Oscuro / Claro -->
        <button
          (click)="toggleTheme()"
          type="button"
          [title]="isDarkMode ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
          class="p-2 text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl transition-all cursor-pointer border border-slate-200/60 dark:border-slate-700 shadow-2xs"
        >
          @if (isDarkMode) {
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
          }
        </button>

        <!-- Avatar Personal -->
        <div class="flex items-center gap-2 pl-1.5 border-l border-slate-200 dark:border-slate-800">
          <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-slate-900 to-slate-700 dark:from-slate-800 dark:to-slate-600 text-white font-bold text-xs flex items-center justify-center ring-2 ring-emerald-500/30 shadow-2xs">
            👤
          </div>
        </div>

      </div>

    </div>
  </div>
</header>
