<header class="sticky top-0 z-30 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 transition-colors shrink-0">
  <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-14 sm:h-15">
      
      <!-- Logo & Brand -->
      <div class="flex items-center gap-2 sm:gap-2.5">
        <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center text-white shadow-md shadow-emerald-500/20 shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 sm:w-5 sm:h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="text-lg sm:text-xl font-bold tracking-tight text-slate-900 dark:text-white">FinanZen</span>
          </div>
          <p class="text-xs text-slate-500 dark:text-slate-400 hidden sm:block">Control de Finanzas Personales & Flujo de Caja</p>
        </div>
      </div>

      <!-- Right Controls: Period, Dark Mode & Primary CTA -->
      <div class="flex items-center gap-1.5 sm:gap-3">
        
        <!-- Period indicator pill -->
        <div class="hidden md:flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 text-xs font-medium border border-slate-200 dark:border-slate-700">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-slate-500 dark:text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
          <span>Periodo: Septiembre 2026</span>
        </div>

        <!-- Quick Access Modal Buttons (Accounts & Categories) -->
        <div class="hidden sm:flex items-center gap-1.5">
          <button
            (click)="openAccountsModal()"
            type="button"
            title="Abrir ventana de Mis Cuentas & Efectivo"
            class="px-2.5 py-1.5 rounded-xl text-xs font-semibold text-slate-700 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition flex items-center gap-1.5 border border-slate-200 dark:border-slate-700 cursor-pointer shadow-2xs"
          >
            <span>💳</span>
            <span>Cuentas</span>
          </button>

          <button
            (click)="openCategoryModal()"
            type="button"
            title="Abrir ventana de Distribución de Gastos"
            class="px-2.5 py-1.5 rounded-xl text-xs font-semibold text-slate-700 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition flex items-center gap-1.5 border border-slate-200 dark:border-slate-700 cursor-pointer shadow-2xs"
          >
            <span>📊</span>
            <span>Gastos</span>
          </button>
        </div>

        <!-- Dark Mode Toggle Button -->
        <button
          (click)="toggleTheme()"
          type="button"
          [title]="isDarkMode ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
          class="p-2 text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl transition-all cursor-pointer border border-slate-200 dark:border-slate-700 shrink-0"
        >
          @if (isDarkMode) {
            <!-- Sun Icon -->
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
          } @else {
            <!-- Moon Icon -->
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
          }
        </button>

        <!-- Primary Action: Registrar Movimiento (Desktop CTA) -->
        <button
          (click)="openNewMovement()"
          type="button"
          class="hidden md:inline-flex items-center gap-2 px-4 py-2 text-sm font-semibold text-white bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 rounded-xl shadow-sm shadow-emerald-600/30 transition-all hover:shadow-md cursor-pointer shrink-0"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
          </svg>
          <span>Registrar Movimiento</span>
        </button>

        <!-- User Avatar -->
        <div class="flex items-center gap-1.5 sm:gap-2 pl-1.5 sm:pl-2 border-l border-slate-200 dark:border-slate-800 shrink-0">
          <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-slate-900 dark:bg-slate-800 text-white font-semibold text-xs flex items-center justify-center ring-2 ring-emerald-500/40">
            JA
          </div>
        </div>

      </div>

    </div>
  </div>
</header>
