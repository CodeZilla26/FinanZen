@if (isOpen) {
  <div class="fixed inset-0 z-50 overflow-y-auto">
    
    <!-- Backdrop Blur -->
    <div 
      (click)="close()" 
      class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm transition-opacity"
    ></div>

    <!-- Modal Box -->
    <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
      <div 
        class="relative transform overflow-hidden rounded-2xl bg-white dark:bg-slate-900 text-left shadow-2xl transition-all sm:my-8 sm:w-full sm:max-w-lg border border-slate-200 dark:border-slate-800"
        (click)="$event.stopPropagation()"
      >
        
        <!-- Header -->
        <div class="px-6 pt-6 pb-4 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <div 
              class="w-8 h-8 rounded-lg flex items-center justify-center font-bold text-sm"
              [class]="isEditing ? 'bg-amber-100 dark:bg-amber-950/60 text-amber-700 dark:text-amber-400' : 'bg-orange-100 dark:bg-orange-950/60 text-orange-700 dark:text-orange-400'"
            >
              @if (isEditing) {
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                </svg>
              } @else {
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
              }
            </div>
            <div>
              <h3 class="text-base font-bold text-slate-900 dark:text-white">
                {{ isEditing ? 'Editar Deuda / Préstamo' : 'Registrar Deuda / Préstamo' }}
              </h3>
              <p class="text-xs text-slate-500 dark:text-slate-400">
                {{ isEditing ? 'Modifica los datos del compromiso financiero' : 'Registra un monto pendiente de pago o cobro' }}
              </p>
            </div>
          </div>
          <button 
            (click)="close()"
            type="button" 
            class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition cursor-pointer"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <!-- Form Body -->
        <form (ngSubmit)="onSubmit()" class="p-6 space-y-4 text-xs">
          
          <!-- Type Switch (Por Pagar vs Por Cobrar) -->
          <div>
            <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1.5">Tipo de Compromiso</label>
            <div class="grid grid-cols-2 gap-2 p-1 rounded-xl bg-slate-100 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700">
              <button
                type="button"
                (click)="setType('payable')"
                [class]="type === 'payable' 
                  ? 'bg-rose-600 text-white shadow-sm font-bold' 
                  : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white font-medium'"
                class="py-2 rounded-lg flex items-center justify-center gap-1.5 transition-all cursor-pointer"
              >
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
                </svg>
                <span>Yo debo (Por pagar)</span>
              </button>

              <button
                type="button"
                (click)="setType('receivable')"
                [class]="type === 'receivable' 
                  ? 'bg-emerald-600 text-white shadow-sm font-bold' 
                  : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white font-medium'"
                class="py-2 rounded-lg flex items-center justify-center gap-1.5 transition-all cursor-pointer"
              >
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M5 10l7-7m0 0l7 7m-7-7v18" />
                </svg>
                <span>Me deben (Por cobrar)</span>
              </button>
            </div>
          </div>

          <!-- Person / Entity & Amount in 2 cols -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">
                {{ type === 'payable' ? '¿A quién le debes? (Acreedor)' : '¿Quién te debe? (Deudor)' }}
              </label>
              <input
                type="text"
                required
                [(ngModel)]="person"
                name="person"
                placeholder="Ej: Carlos Gómez, Tarjeta BCP, Mamá..."
                class="w-full px-3.5 py-2.5 text-xs bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500 text-slate-900 dark:text-white"
              />
            </div>

            <div>
              <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Monto de la deuda (S/)</label>
              <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 dark:text-slate-500 font-bold">
                  S/
                </div>
                <input
                  type="number"
                  step="0.01"
                  min="0.01"
                  required
                  [(ngModel)]="amount"
                  name="amount"
                  placeholder="0.00"
                  class="w-full pl-10 pr-4 py-2.5 text-xs font-semibold bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500 text-slate-900 dark:text-white"
                />
              </div>
            </div>
          </div>

          <!-- Concept / Title Input -->
          <div>
            <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Concepto o Motivo</label>
            <input
              type="text"
              required
              [(ngModel)]="title"
              name="title"
              placeholder="Ej: Préstamo para víveres, Cena de fin de semana, Alquiler pendiente..."
              class="w-full px-3.5 py-2.5 text-xs bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500 text-slate-900 dark:text-white"
            />
          </div>

          <!-- Dates: Date acquired & Due date -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Fecha de la Deuda</label>
              <input
                type="date"
                required
                [(ngModel)]="date"
                name="date"
                class="w-full px-3 py-2.5 text-xs bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500 text-slate-800 dark:text-slate-200"
              />
            </div>

            <div>
              <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">
                Fecha Límite / Compromiso <span class="text-slate-400 font-normal">(Opcional)</span>
              </label>
              <input
                type="date"
                [(ngModel)]="dueDate"
                name="dueDate"
                class="w-full px-3 py-2.5 text-xs bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500 text-slate-800 dark:text-slate-200"
              />
            </div>
          </div>

          <!-- Notes Input -->
          <div>
            <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">
              Notas u Observaciones <span class="text-slate-400 font-normal">(Opcional)</span>
            </label>
            <input
              type="text"
              [(ngModel)]="notes"
              name="notes"
              placeholder="Ej: Se acordó transferir por Yape a fin de mes..."
              class="w-full px-3.5 py-2.5 text-xs bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500 text-slate-900 dark:text-white"
            />
          </div>

          <!-- Footer Buttons -->
          <div class="pt-4 border-t border-slate-100 dark:border-slate-800 flex items-center justify-end gap-2.5">
            <button
              (click)="close()"
              type="button"
              class="px-4 py-2 text-xs font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition cursor-pointer"
            >
              Cancelar
            </button>
            <button
              type="submit"
              [disabled]="isSaving() || !title.trim() || !person.trim() || !amount || amount <= 0"
              class="inline-flex items-center gap-2 px-5 py-2 text-xs font-semibold text-white bg-orange-600 hover:bg-orange-700 rounded-xl shadow-sm transition cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
            >
              @if (isSaving()) {
                <svg class="animate-spin -ml-1 mr-1 h-3.5 w-3.5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                </svg>
                <span>Guardando en Firestore...</span>
              } @else if (isEditing) {
                <span>Actualizar Deuda</span>
              } @else {
                <span>Guardar Compromiso</span>
              }
            </button>
          </div>

        </form>

      </div>
    </div>

  </div>
}
